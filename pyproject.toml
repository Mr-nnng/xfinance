[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "xfinance"
version = "0.1.0"
description = "个人股票查看器：任意标的 × 任意硬通货"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "eltdx>=3.3.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
xfinance-app = "app.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/fastapi-vue/buildhook.py"

[tool.hatch.build.targets.sdist]
include = [
    "app",
    "frontend",
    "scripts",
    "tests",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "alembic.ini",
    "docs",
    "PLAN.md",
    "README.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true
